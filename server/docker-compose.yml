services:
  api:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      VEX_API_TOKEN: ${VEX_API_TOKEN:?Set VEX_API_TOKEN in the environment}
      VEX_WORKER_IMAGE: vex-apk-worker:latest
      MAX_CONCURRENT_BUILDS: "1"
      JOB_ROOT: /opt/vex/jobs
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/vex/jobs:/opt/vex/jobs
    restart: unless-stopped
